<header class="page-head">
  <p class="page-kicker">{{sections.archive.en}} · {{sections.archive.kicker}}</p>
  <h1 class="page-title">{{sections.archive.title}}</h1>
  <figure class="epigraph">
    <blockquote>{{epigraph.text}}</blockquote>
    <figcaption>{{epigraph.note}}</figcaption>
  </figure>
  <p class="page-count">共 {{total}} 篇，都按年份排好了。</p>
</header>

<div class="archive">
  {{#years}}
  <section class="archive-year" aria-label="{{year}} 年">
    <h2 class="year-label"><span>{{year}}</span><em>{{count}} 篇</em></h2>
    <ul class="archive-list">{{{rows}}}</ul>
  </section>
  {{/years}}
</div>

<nav class="page-foot-nav" aria-label="更多">
  <a href="/posts/">全部文章<i aria-hidden="true">→</i></a>
  <a href="/tags/">按标签<i aria-hidden="true">→</i></a>
</nav>
