<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="双击运行与编辑文件的区别">
  <rect width="960" height="540" fill="#f3ead8"/>
  <text x="30" y="40" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="21" font-weight="bold" fill="#241c15">双击 = 运行；不是往文件里打字</text>
  <text x="30" y="64" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13" fill="#8c2f20">你刚才多写了一行 2 —— 那等于"改程序"，不是"选菜单"。</text>
  <rect x="30" y="90" width="420" height="300" rx="3" fill="#fdf8ec" stroke="#241c15" stroke-width="1.2"/>
  <rect x="30" y="90" width="420" height="30" rx="3" fill="#e6d8bc" stroke="#241c15" stroke-width="1.2"/>
  <rect x="30" y="112" width="420" height="8" fill="#e6d8bc"/>
  <text x="44" y="111" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" fill="#241c15">0-开始.cmd</text>
  <text x="436" y="111" text-anchor="end" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="10.5" fill="#7d6a54">编辑器（viewing / editing）</text>
  <text x="52" y="150" font-family="Consolas, Cascadia Mono, monospace" font-size="12.5" fill="#4c3d2f">@echo off</text>
  <text x="52" y="176" font-family="Consolas, Cascadia Mono, monospace" font-size="12.5" fill="#4c3d2f">cd /d "%~dp0"</text>
  <text x="52" y="202" font-family="Consolas, Cascadia Mono, monospace" font-size="12.5" fill="#4c3d2f">python menu.py</text>
  <text x="52" y="228" font-family="Consolas, Cascadia Mono, monospace" font-size="12.5" fill="#4c3d2f">pause</text>
  <rect x="40" y="238" width="400" height="22" fill="#8c2f20" opacity="0.12"/>
  <text x="52" y="254" font-family="Consolas, Cascadia Mono, monospace" font-size="12.5" fill="#8c2f20" font-weight="bold">2</text>
  <text x="30" y="428" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="14.5" font-weight="bold" fill="#8c2f20">✗ 不要在这里写数字</text>
  <text x="30" y="450" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11.5" fill="#4c3d2f">文件里每一行都是一条命令。多写一个 2，</text>
  <text x="30" y="468" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11.5" fill="#4c3d2f">电脑就会去找一个叫"2"的程序，然后报错。</text>
  <path d="M456 240h44" stroke="#8c2f20" stroke-width="1.4" stroke-dasharray="4 4" fill="none"/>
  <path d="M500 236l8 4-8 4z" fill="#8c2f20"/>
  <text x="478" y="226" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="10.5" fill="#8c2f20">双击</text>
  <rect x="510" y="90" width="420" height="300" rx="3" fill="#14110d" stroke="#241c15" stroke-width="1.2"/>
  <rect x="510" y="90" width="420" height="30" rx="3" fill="#2a231c" stroke="#241c15" stroke-width="1.2"/>
  <rect x="510" y="112" width="420" height="8" fill="#2a231c"/>
  <text x="524" y="111" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11.5" fill="#d8cdb4">命令提示符 — 0-开始.cmd</text>
  <text x="916" y="111" text-anchor="end" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="10.5" fill="#7d6a54">运行时弹出的窗口</text>
  <text x="524" y="146" font-family="Consolas, Cascadia Mono, monospace" font-size="11" fill="#e6ddc8">      饮冰室 · 控制台</text>
  <text x="524" y="167" font-family="Consolas, Cascadia Mono, monospace" font-size="11" fill="#7d6a54">   ------------------------------------</text>
  <text x="524" y="188" font-family="Consolas, Cascadia Mono, monospace" font-size="11" fill="#d8cdb4">      1   生成网站          改完内容后点这个</text>
  <text x="524" y="209" font-family="Consolas, Cascadia Mono, monospace" font-size="11" fill="#f0e6cf">      2   本地预览          生成并用浏览器打开</text>
  <text x="524" y="230" font-family="Consolas, Cascadia Mono, monospace" font-size="11" fill="#d8cdb4">      3   写一篇新文章</text>
  <text x="524" y="251" font-family="Consolas, Cascadia Mono, monospace" font-size="11" fill="#d8cdb4">      4   安装分享图组件    可选</text>
  <text x="524" y="272" font-family="Consolas, Cascadia Mono, monospace" font-size="11" fill="#d8cdb4">      5   打开项目文件夹</text>
  <text x="524" y="293" font-family="Consolas, Cascadia Mono, monospace" font-size="11" fill="#d8cdb4">      6   检查环境</text>
  <text x="524" y="314" font-family="Consolas, Cascadia Mono, monospace" font-size="11" fill="#d8cdb4">      0   退出</text>
  <text x="524" y="356" font-family="Consolas, Cascadia Mono, monospace" font-size="11" fill="#f0e6cf">      请输入数字后按回车（比如想预览就输入 2）：</text>
  <text x="788" y="356" font-family="Consolas, Cascadia Mono, monospace" font-size="13" font-weight="bold" fill="#8ecf6f">2</text>
  <rect x="799" y="345" width="8" height="13" fill="#8ecf6f" opacity="0.85"/>
  <text x="510" y="428" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="14.5" font-weight="bold" fill="#3f6b34">✓ 双击之后，在这里输入 2 再按回车</text>
  <text x="510" y="450" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11.5" fill="#4c3d2f">光标停在这一行闪烁，直接敲数字就行，</text>
  <text x="510" y="468" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11.5" fill="#4c3d2f">文件本身一个字都不用动。</text>
  <rect x="30" y="492" width="900" height="34" fill="#8c2f20" opacity="0.08" stroke="#a3813c" stroke-width="0.8"/>
  <text x="480" y="514" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13" fill="#241c15">记住：.cmd 文件只负责"双击"，数字在弹出的小黑窗口里输入。</text>
</svg>
